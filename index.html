<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fleet Span University</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — top bar with demo switcher, left nav (tabs on phones), working area of tables and panels */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --sunk:#e9edf1; --ink:#1b232c; --muted:#5a6672; --line:#d9dfe5;
  --accent:#1d5f8c; --accent-ink:#ffffff; --accent-soft:#e2edf5;
  --good:#2b7a4b; --good-soft:#e1f1e7; --warn:#a3670f; --warn-soft:#fbefd9;
  --bad:#b23b2a; --bad-soft:#f8e3df; --internal:#5f4596; --internal-soft:#ece6f6;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161b; --surface:#1a2129; --sunk:#151b22; --ink:#e5e9ed; --muted:#9aa6b2; --line:#2b343e;
  --accent:#6aa8d6; --accent-ink:#0c1a26; --accent-soft:#1a2e3e;
  --good:#63c08a; --good-soft:#173024; --warn:#e2b053; --warn-soft:#33281a;
  --bad:#e57b66; --bad-soft:#3a201c; --internal:#b39be6; --internal-soft:#2a2340; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161b; --surface:#1a2129; --sunk:#151b22; --ink:#e5e9ed; --muted:#9aa6b2; --line:#2b343e;
  --accent:#6aa8d6; --accent-ink:#0c1a26; --accent-soft:#1a2e3e;
  --good:#63c08a; --good-soft:#173024; --warn:#e2b053; --warn-soft:#33281a;
  --bad:#e57b66; --bad-soft:#3a201c; --internal:#b39be6; --internal-soft:#2a2340; color-scheme:dark }
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:28px} h2{font-size:21px} h3{font-size:17px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.01em}
.switch{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.switch label{font-size:13px;color:var(--muted)}
select,input[type=text],input[type=date],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
.demo{background:var(--warn-soft);color:var(--ink);font-size:13px;padding-block:7px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo b{color:var(--warn)}

/* shell */
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 110px)}
nav.side{border-right:1px solid var(--line);background:var(--surface);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;cursor:pointer;color:var(--ink);font-weight:600;font-size:14.5px}
.navbtn:hover{background:var(--sunk)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.count{font-family:var(--f-mono);font-size:12px;background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;line-height:19px}
.navgroup{margin:14px 10px 4px}
main{padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1080px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.head p{color:var(--muted);margin-top:4px}

@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  nav.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;gap:4px}
  .navbtn{width:auto;white-space:nowrap}
  .navgroup{display:none}
}

/* panels, tables */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-notstarted{background:var(--sunk);color:var(--muted)}
.s-progress{background:var(--accent-soft);color:var(--accent)}
.s-awaiting{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.s-needsIP{background:var(--warn-soft);color:var(--warn)}
.s-overdue{background:var(--bad-soft);color:var(--bad)}
.s-completed{background:var(--good-soft);color:var(--good)}
.s-late{background:var(--surface);color:var(--good);border-color:var(--good)}
.s-final{background:var(--internal);color:var(--surface)}
.s-contact{background:var(--sunk);color:var(--ink);border-color:var(--line)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 6px;background:var(--sunk);color:var(--muted)}
.tag.verify{background:var(--warn-soft);color:var(--warn)}
.tag.internal{background:var(--internal-soft);color:var(--internal)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:6px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.good{background:var(--good);color:var(--surface);border-color:var(--good)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.1}
.kpi .v.bad{color:var(--bad)}
.kpi .l{font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}

/* cards for my training */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;width:100%}
.card:hover{border-color:var(--accent)}
.card .meta{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}

/* player */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:6px}
.steps li:hover{background:var(--sunk)}
.steps input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.steps .n{font-family:var(--f-mono);color:var(--muted);font-size:13px;width:18px;flex:none;margin-top:1px}
.steps .done span.t{color:var(--muted);text-decoration:line-through}
.q select{width:100%;max-width:560px;padding:9px 10px}
.ql{padding:0!important;cursor:default!important}
.ql:hover{background:none!important}
.sobox{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--sunk)}
ul.guide{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.q{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q label{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer}
.q label:hover{background:var(--sunk)}
.q input{accent-color:var(--accent);margin-top:4px}
.callout{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14.5px}
.callout.info{background:var(--accent-soft)}
.callout.good{background:var(--good-soft)}
.callout.warn{background:var(--warn-soft)}
.callout.bad{background:var(--bad-soft)}
.callout.internal{background:var(--internal-soft);border:1px dashed var(--internal)}
.locked{opacity:.55}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px 20px}
.facts div span{display:block}
.facts .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:5}
.cell{background:none;border:0;padding:0;cursor:pointer}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.fieldgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600}
.checklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.checklist label{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.checklist label.off{opacity:.5;cursor:not-allowed}
.email{font-family:var(--f-mono);font-size:13px;background:var(--sunk);border-radius:6px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){.btn,.card,.navbtn{transition:background .15s,border-color .15s}}
</style>

</head>
<body>
<header class="top">
  <div class="brand"><div class="mark" aria-hidden="true">FS</div><b>Fleet Span University</b></div>
  <div class="switch">
    <label for="viewer">Viewing as</label>
    <select id="viewer"></select>
    <button class="btn" data-act="reset" type="button">Reset demo</button>
  </div>
</header>
<div class="demo"><b>Demo with sample people and data.</b> In the real app, each person's Microsoft login decides what they see. The "Viewing as" switcher exists only in this demo.</div>
<div class="shell">
  <nav class="side" id="nav" aria-label="Main"></nav>
  <main id="main"></main>
</div>
<div class="flash" id="flash" hidden></div>

<script>
const TODAY = '2026-10-15';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = d => d ? MONTHS[+d.slice(5,7)-1] + ' ' + (+d.slice(8,10)) : '—';
const addDays = (iso,n) => { const d = new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a,b) => b ? Math.round(a/b*100) : null;
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

const SEED = {
  people: [
    {id:'dana', name:'Dana Ruiz', role:'Operations Director', access:'Admin', loc:'Main shop', mgr:null, active:true},
    {id:'marcus', name:'Marcus Hale', role:'Service Manager', access:'Manager', loc:'Main shop', mgr:'dana', active:true},
    {id:'priya', name:'Priya Shah', role:'Service Manager', access:'Manager', loc:'North yard', mgr:'dana', active:true},
    {id:'gus', name:'Gus Pruitt', role:'Tech', access:'Reviewer', loc:'Main shop', mgr:'marcus', active:true},
    {id:'luis', name:'Luis Ortega', role:'Tech', access:'Employee', loc:'Main shop', mgr:'marcus', active:true},
    {id:'jake', name:'Jake Turner', role:'Tech', access:'Employee', loc:'Main shop', mgr:'marcus', active:true},
    {id:'andre', name:'Andre Wells', role:'Tech', access:'Employee', loc:'Main shop', mgr:'marcus', active:true},
    {id:'kelly', name:'Kelly Moss', role:'Service Advisor', access:'Employee', loc:'Main shop', mgr:'marcus', active:true},
    {id:'ray', name:'Ray Collins', role:'Parts', access:'Employee', loc:'Main shop', mgr:'marcus', active:true},
    {id:'sam', name:'Sam Becker', role:'Tech', access:'Employee', loc:'North yard', mgr:'priya', active:true},
    {id:'tony', name:'Tony Nguyen', role:'Tech', access:'Employee', loc:'North yard', mgr:'priya', active:true},
    {id:'eli', name:'Eli Foster', role:'Tech', access:'Employee', loc:'North yard', mgr:'priya', active:true},
    {id:'ben', name:'Ben Ortiz', role:'Service Advisor', access:'Employee', loc:'North yard', mgr:'priya', active:true}
  ],
  modules: [
    {id:'t1', title:'Clock on and off jobs', roles:['Tech'], tier:'Module 1', status:'Published', version:2, days:7,
      why:"Your clocked time is how the shop knows what each job really took. Wrong clocks mean wrong efficiency and wrong pay conversations.",
      before:["You are logged into Fullbay","You have clocked in and are on your **Tech Home**.","The Service Order (SO) you are working on has been assigned to you."],
      doneRight:"At the end of the day every hour is on the right SO and job, or on a labeled activity.",
      wrong:["Clocked into the wrong job: clock out, clock into the right one, and leave a note on the SO for your Service Manager.","If you forgot to clock in, leave a note with your start and end time for the day for your Service Manager to correct. You will also need to have a conversation regarding what jobs you worked on that day so allocate time to them correctly."],
      items:[
      {type:'step', text:"Open **Tech Home**."},
      {type:'step', text:"Find the SO and the Action Item (the job) you are about to work on."},
      {type:'step', text:"Click the Action Item to clock into that job your red banner will turn green."},
      {type:'step', text:"To change what you are doing (for example from the job to a break or training), use the arrow next to the clock button and pick the activity."},
      {type:'step', text:"When you finish or repair, mark the job as complete before you leave the jobsite.."},
      {type:'step', text:"Samsara: **[Confirm with your Service Manager how clock-ins work with Samsara at this location]**"},
      {type:'quiz', q:"How do you clock into a job?", options:["Tell your Service Advisor","Click the Action Item","Write your start time in the SO notes","Clock in at the front desk"], answer:1},
      {type:'quiz', q:"What happens when you clock into the job?", options:["Your red banner will turn green","You get an email","The SO moves to Review","Parts gets notified"], answer:0},
      {type:'quiz', q:"How do you change from the job to a break or training?", options:["Clock out for the day","Use the arrow next to the clock button and pick the activity","Leave the clock running on the job","Ask Parts to change it"], answer:1},
      {type:'quiz', q:"You clocked into the wrong job. What do you do?", options:["Leave it, the hours even out","Clock out, clock into the right one, and leave a note on the SO for your Service Manager","Delete the SO","Tell the customer"], answer:1},
      {type:'quiz', q:"What does done right look like?", options:["At the end of the day every hour is on the right SO and job, or on a labeled activity","You clocked in and out once","Most of your hours are on jobs","Your Service Advisor has your times"], answer:0},
      {type:'signoff', text:"You clock onto the right SO and job for a full shift with no corrections from the Service Manager."}
    ]},
    {id:'t2', title:'Diagnose button on the SO', roles:['Tech'], tier:'Module 2', status:'Published', version:2, days:14,
      why:"Diagnose is where the job gets real. Until it is marked diagnosed, Parts cannot quote and the customer cannot approve.",
      before:["The SO is in the **Diagnose** stage (the Service Advisor has created it and captured the customer signature).","You are clocked onto the job (Module 1)."],
      doneRight:"The Action Item shows diagnosed, the findings are clear enough that someone who was not there understands them, and parts are listed.",
      wrong:["You cannot find the button: the SO may not be past the signature step. Ask your Service Advisor.","You need to change the diagnosis after marking it: tell ask your Service Advisor to change it."],
      items:[
      {type:'step', text:"Open the SO from **Tech Home**."},
      {type:'step', text:"Open the Action Item you are diagnosing."},
      {type:'step', text:"Write what you found in the **Cause** field. Say what is wrong in clear words and use AI to clean up your story."},
      {type:'step', text:"Add the parts you need (see Module 4). Do not enter prices."},
      {type:'step', text:"If the screen asks for usage (mileage or hours), enter it."},
      {type:'step', text:"Click **Diagnosed** on the Action Item. This sends any Special Order parts to Parts for a quote."},
      {type:'step', text:"Move to your next action item and repeat the above steps until all repairs have been diagnosed."},
      {type:'quiz', q:"What stage must the SO be in before you diagnose?", options:["Review","Diagnose","Invoiced","Closed"], answer:1},
      {type:'quiz', q:"Where do you write what you found?", options:["In the Cause field","In a text to the Service Advisor","On a sticky note","In the customer notes"], answer:0},
      {type:'quiz', q:"When you add the parts you need, what do you leave out?", options:["The part description","The quantity","Prices","Nothing"], answer:2},
      {type:'quiz', q:"What happens when you click Diagnosed on the Action Item?", options:["The SO is invoiced","It sends any Special Order parts to Parts for a quote","You are clocked out","The customer is charged"], answer:1},
      {type:'quiz', q:"You cannot find the button. What is the likely reason?", options:["Your login is broken","The SO may not be past the signature step","Parts has not quoted yet","The job is already complete"], answer:1},
      {type:'signoff', text:"You complete Diagnose on 5 SOs with no corrections."}
    ]},
    {id:'t3', title:'Inspection on every SO', roles:['Tech'], tier:'Module 3', status:'Published', version:2, days:14,
      why:"The inspection finds the extra work the customer did not ask about. It is how the shop catches problems early and adds honest revenue. This is critical in preventing failures and building trust with your customer.",
      before:["The SO has an inspection added automatically. It appears on SOs with a complaint that is not yet diagnosed."],
      doneRight:"Every line has a result, and every defect has its own Action Item that Parts and the Service Advisor can see.",
      wrong:["The inspection is missing: tell your Service Advisor right away.","Do not skip lines to save time. A skipped line means missed work."],
      items:[
      {type:'step', text:"Open the SO and find the inspection line."},
      {type:'step', text:"Work down the procedure list one line at a time."},
      {type:'step', text:"For each line, mark the result honestly."},
      {type:'step', text:"If something is bad, mark it **Defective**. Fullbay creates a new Action Item for it automatically."},
      {type:'step', text:"Add notes or photos if the screen allows."},
      {type:'step', text:"Finish every line before you complete the inspection."},
      {type:'quiz', q:"Which SOs have an inspection added automatically?", options:["Only PM SOs","SOs with a complaint that is not yet diagnosed","Only when the customer asks","Only new customers"], answer:1},
      {type:'quiz', q:"How do you work the procedure list?", options:["Skip to the lines that matter","One line at a time","Mark everything at once","Only the first page"], answer:1},
      {type:'quiz', q:"Something is bad. What do you mark it?", options:["Defective","Passed","Skipped","Diagnosed"], answer:0},
      {type:'quiz', q:"What does Fullbay do when you mark a line Defective?", options:["Invoices the customer","Creates a new Action Item for it automatically","Clocks you out","Closes the SO"], answer:1},
      {type:'quiz', q:"The inspection is missing. What do you do?", options:["Skip it","Tell your Service Advisor right away","Make up your own checklist","Wait for the next visit"], answer:1},
      {type:'signoff', text:"You complete the inspection on 10 SOs."}
    ]},
    {id:'t4', title:'Request parts on the SO', roles:['Tech'], tier:'Module 4', status:'Published', version:2, days:14,
      why:"When you ask for parts on the SO, Parts can quote, order and receive without chasing you. Calls and sticky notes get lost.",
      before:["You know the job, the unit and the part you need."],
      doneRight:"Every part you need is on the right Action Item with the right quantity, and you never had to walk/call the parts counter to explain it.",

let DB;
const S = { viewer:'dana', view:'dashboard', enr:null, mod:null, quiz:null, ef:null, flashT:null };
function seed(){ DB = JSON.parse(JSON.stringify(SEED)); S.ef = null; S.quiz = null; }
seed();

const P = id => DB.people.find(p => p.id === id);
const M = id => DB.modules.find(m => m.id === id);
const E = id => DB.enr.find(e => e.id === id);
const me = () => P(S.viewer);
const lvl = () => me().access;
function teamOf(id){ const out = []; const walk = m => DB.people.filter(p => p.mgr === m).forEach(p => { out.push(p.id); walk(p.id); }); walk(id); return out; }
function scope(){ const v = me(); if (v.access === 'Admin') return DB.people.map(p => p.id); if (v.access === 'Manager') return teamOf(v.id); return [v.id]; }
function smOf(empId){ let p = P(empId); while (p && p.mgr){ const m = P(p.mgr); if (m.role === 'Service Manager') return m; p = m; } return null; }
function log(what, internal){ DB.audit.unshift({date:TODAY, who:me().name, what, internal:!!internal}); }

/* ---------- status rules ---------- */
const phaseAtt = (e,ph) => e.attempts.filter(a => a.phase === ph);
const stepsTotal = e => M(e.mod).items.filter(i => i.type === 'step').length;
const stepsComplete = e => e.stepsDone.length >= stepsTotal(e);
const soReady = e => !!(e.so && e.so.trim());
const quizPassed = e => phaseAtt(e, e.ip).some(a => a.score >= 80);
const signoffOk = e => e.ip === 0 ? e.handsOn : e.smSign >= e.ip;
const bestScore = e => e.attempts.length ? Math.max(...e.attempts.map(a => a.score)) : null;
function status(e){
  if (e.done) return e.done <= e.due ? 'completed' : 'late';
  const cur = phaseAtt(e, e.ip), limit = e.ip === 0 ? 2 : 1;
  if (e.ip === 2 && cur.length && !quizPassed(e)) return 'final';
  if (cur.length >= limit && !quizPassed(e)) return 'needsIP';
  if (e.due < TODAY) return 'overdue';
  if (quizPassed(e)) return 'awaiting';
  if (e.stepsDone.length || e.attempts.length || e.ip) return 'progress';
  return 'notstarted';
}
const canSeeFinal = e => lvl() === 'Admin' || (smOf(e.emp) && smOf(e.emp).id === S.viewer);
function shown(e){ const s = status(e); return (s === 'final' && !canSeeFinal(e)) ? 'contact' : s; }
const LABEL = {notstarted:'Not started', progress:'In progress', awaiting:'Awaiting sign-off', needsIP:'Needs in-person training', overdue:'Overdue', completed:'Completed', late:'Completed late', final:'Final attempt failed', contact:'See your Service Manager'};
const RANK = {final:0, needsIP:1, overdue:2, awaiting:3, progress:4, notstarted:5, contact:6, late:7, completed:8};
const pill = s => `<span class="pill s-${s}">${LABEL[s]}</span>`;
function maybeComplete(e){ if (!e.done && stepsComplete(e) && quizPassed(e) && signoffOk(e)) { e.done = TODAY; return true; } return false; }
function quizFields(qs, key, disabled){
  return qs.map((q,qi) => `<div class="q"><label class="ql" for="q${key}_${qi}"><b>${qi + 1}. ${esc(q.q)}</b></label><select id="q${key}_${qi}" name="q${qi}" ${disabled ? 'disabled' : ''}><option value="">Choose an answer</option>${q.options.map((o,oi) => `<option value="${oi}">${esc(o)}</option>`).join('')}</select></div>`).join('');
}
const phaseName = (ph, i) => ph === 0 ? `Online attempt ${i}` : `After in-person training ${ph}`;

function homeFor(){ return {Admin:'dashboard', Manager:'dashboard', Reviewer:'queue', Employee:'mytraining'}[lvl()]; }

function queueItems(){
  const sc = scope();
  return DB.enr.filter(e => {
    if (e.done) return false;
    const st = status(e);
    if (e.ip === 0 && st !== 'needsIP' && quizPassed(e) && !e.handsOn) {
      return e.reviewer === S.viewer || (lvl() !== 'Reviewer' && sc.includes(e.emp));
    }
    if (e.ip > 0 && e.smSign < e.ip && !['final','needsIP'].includes(st)) {
      return lvl() === 'Admin' || (smOf(e.emp) && smOf(e.emp).id === S.viewer);
    }
    return false;
  });
}

function renderNav(){
  const sc = scope();
  const attention = DB.enr.filter(e => sc.includes(e.emp) && e.emp !== S.viewer && ['overdue','needsIP','final'].includes(status(e))).length;
  const counts = { queue: queueItems().length, team: attention, mytraining: DB.enr.filter(e => e.emp === S.viewer && !e.done).length };
  const cur = PARENT[S.view] || S.view;
  let html = '';
  NAV.filter(n => n.who.includes(lvl())).forEach(n => {
    if (n.group) html += `<div class="navgroup eyebrow">${n.group}</div>`;
    const c = counts[n.id];
    const badge = c ? `<span class="count" ${n.id === 'mytraining' ? 'style="background:var(--accent);color:var(--accent-ink)"' : ''}>${c}</span>` : '';
    html += `<button class="navbtn" type="button" data-act="go" data-v="${n.id}" ${cur === n.id ? 'aria-current="page"' : ''}><span>${n.label}</span>${badge}</button>`;
  });
  document.getElementById('nav').innerHTML = html;
}

/* ---------- views ---------- */
function vMyTraining(){
  const mine = DB.enr.filter(e => e.emp === S.viewer).sort((a,b) => (!!a.done - !!b.done) || a.due.localeCompare(b.due));
  const v = me();
  const open = mine.filter(e => !e.done), done = mine.filter(e => e.done);
  const card = e => { const m = M(e.mod), s = shown(e), b = bestScore(e);
    return `<button class="card" type="button" data-act="open" data-id="${e.id}">
      <div class="meta"><span class="tag">${esc(m.roles.join(', '))} · ${m.tier}</span>${pill(s)}</div>
      <h3>${esc(m.title)}</h3>
      <div class="meta small muted"><span>${e.done ? 'Finished ' + fmt(e.done) : 'Due <span class="mono">' + fmt(e.due) + '</span>'}</span><span>${b !== null ? 'Best score <span class="mono">' + b + '%</span>' : e.stepsDone.length + ' of ' + stepsTotal(e) + ' steps'}</span></div>
    </button>`; };
  return `<div class="head"><div><h1>My Training</h1><p>${esc(v.name)} · ${esc(v.role)}</p></div></div>
    ${open.length ? `<div class="cards">${open.map(card).join('')}</div>` : `<div class="empty">Nothing assigned to you right now.</div>`}
    ${done.length ? `<h2>Finished</h2><div class="cards">${done.map(card).join('')}</div>` : ''}`;
}

function vPlayer(){
  const e = E(S.enr); if (!e) return vMyTraining();
  const m = M(e.mod), s = shown(e), st = status(e);
  const steps = m.items.filter(i => i.type === 'step'), qs = m.items.filter(i => i.type === 'quiz'), so = m.items.find(i => i.type === 'signoff');
  const mineView = e.emp === S.viewer;
  const locked = e.done || st === 'final' || st === 'needsIP';
  const cur = phaseAtt(e, e.ip), limit = e.ip === 0 ? 2 : 1;
  const canQuiz = mineView && !locked && stepsComplete(e) && soReady(e) && !quizPassed(e) && cur.length < limit;
  const rev = P(e.reviewer), sm = smOf(e.emp);

  let quizBlock;
  const qr = S.quiz && S.quiz.id === e.id ? S.quiz : null;
  const result = qr ? `<div class="callout ${qr.pass ? 'good' : 'bad'}"><b>${qr.pass ? 'Passed' : 'Not passed'}: ${qr.score}%</b><span>${esc(qr.msg)}</span></div>` : '';
  if (st === 'final' || s === 'contact') {
    quizBlock = mineView ? `<div class="callout warn"><b>Please see your Service Manager.</b><span>${esc(sm ? sm.name : 'Your Service Manager')} will talk with you about next steps.</span></div>` : '';
  } else if (st === 'needsIP') {
    quizBlock = `<div class="callout warn"><b>In-person training is next.</b><span>${esc(sm ? sm.name : 'Your Service Manager')} will schedule ${e.ip === 0 ? 'an in-person session' : 'another in-person session'}. After it, you get a fresh quiz and a sign-off from your Service Manager.</span></div>`;
  } else if (quizPassed(e)) {
    const a = cur.find(x => x.score >= 80);
    quizBlock = `<div class="callout good"><b>Quiz passed: ${a.score}%</b><span>${e.attempts.length} attempt${e.attempts.length > 1 ? 's' : ''} on record.</span></div>`;
  } else if (!stepsComplete(e)) {
    quizBlock = `<p class="muted">Finish every step to unlock the quiz. You need 80% to pass. You get ${e.ip === 0 ? '2 attempts' : '1 fresh attempt after in-person training'}.</p>`;
  } else if (!soReady(e)) {
    quizBlock = `<p class="muted">Enter the SO number you completed the steps on to unlock the quiz.</p>`;
  } else if (canQuiz) {
    quizBlock = `<p class="small muted">Attempt ${cur.length + 1} of ${limit}${e.ip ? ' (after in-person training)' : ''}. You need 80% to pass.</p>
      <form id="quizForm" data-id="${e.id}">${quizFields(qs, e.id, false)}
      <div class="row"><button class="btn primary" type="submit">Submit answers</button></div></form>`;
  } else {
    quizBlock = `<p class="muted">The quiz is available to the employee.</p>`;
  }

  let signBlock;
  if (e.ip === 0) {
    signBlock = e.handsOn ? `<div class="callout good"><b>Hands-on check passed</b><span>Signed off by ${esc(rev ? rev.name : 'reviewer')}.</span></div>`

  return `<div class="head"><div><h1>Modules</h1><p>Only admins create and edit modules. Only published modules can be assigned.</p></div></div>
  <div class="tablewrap"><table><thead><tr><th>Module</th><th>Job roles</th><th>Tier</th><th class="num">Items</th><th class="num">Enrolled</th><th>Status</th></tr></thead><tbody>
  ${DB.modules.map(m => `<tr class="click" data-act="modopen" data-id="${m.id}"><td><b>${esc(m.title)}</b></td><td>${esc(m.roles.join(', '))}</td><td>${m.tier}</td><td class="num">${m.items.length}</td><td class="num">${DB.enr.filter(e => e.mod === m.id).length}</td><td>${m.status === 'Published' ? '<span class="pill s-completed">Published</span>' : '<span class="pill s-notstarted">Draft</span>'}</td></tr>`).join('')}
  </tbody></table></div>`;
}

function vRoster(){
  return `<div class="head"><div><h1>Roster</h1><p>Microsoft confirms who someone is. This roster decides what they can do. People are deactivated, never deleted, so their training history stays.</p></div></div>
  <div class="tablewrap"><table><thead><tr><th>Name</th><th>Job role</th><th>Access level</th><th>Location</th><th>Reports to</th><th>Active</th></tr></thead><tbody>
  ${DB.people.map(p => `<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.role)}</td><td><select id="acc_${p.id}" data-access="${p.id}" aria-label="Access level for ${esc(p.name)}" ${p.id === S.viewer ? 'disabled' : ''}>${['Admin','Manager','Reviewer','Employee'].map(a => `<option ${a === p.access ? 'selected' : ''}>${a}</option>`).join('')}</select></td><td>${esc(p.loc)}</td><td>${esc(p.mgr ? P(p.mgr).name : '—')}</td><td><input type="checkbox" id="act_${p.id}" data-active="${p.id}" ${p.active ? 'checked' : ''} ${p.id === S.viewer ? 'disabled' : ''} aria-label="Active"></td></tr>`).join('')}
  </tbody></table></div>`;
}

function vAudit(){
  return `<div class="head"><div><h1>Audit log</h1><p>Sign-offs, in-person training, due date changes, access changes and status escalations.</p></div></div>
  <div class="tablewrap"><table><thead><tr><th>Date</th><th>By</th><th>What changed</th></tr></thead><tbody>
  ${DB.audit.map(a => `<tr><td class="mono">${fmt(a.date)}</td><td>${esc(a.who)}</td><td>${esc(a.what)} ${a.internal ? '<span class="tag internal">Internal</span>' : ''}</td></tr>`).join('')}
  </tbody></table></div>`;
}

const VIEWS = {mytraining:vMyTraining, player:vPlayer, queue:vQueue, dashboard:vDashboard, team:vTeam, detail:vDetail, enroll:vEnroll, reminders:vReminders, modules:vModules, roster:vRoster, audit:vAudit};

function render(){
  if (!allowed(S.view)) { S.view = homeFor(); }
  const sel = document.getElementById('viewer');
  const opts = [['dana','Admin'],['marcus','Service Manager'],['priya','Service Manager'],['gus','Reviewer'],['luis','Tech']];
  sel.innerHTML = opts.map(([id,t]) => `<option value="${id}" ${id === S.viewer ? 'selected' : ''}>${t} · ${esc(P(id).name)}</option>`).join('');
  renderNav();
  document.getElementById('main').innerHTML = `<div class="wrap">${VIEWS[S.view]()}</div>`;
}
function flash(msg){ const f = document.getElementById('flash'); f.textContent = msg; f.hidden = false; clearTimeout(S.flashT); S.flashT = setTimeout(() => { f.hidden = true; }, 3200); }

/* ---------- actions ---------- */
const ACT = {
  go: d => { S.view = d.v; S.mod = null; window.scrollTo(0,0); },
  open: d => { S.view = 'player'; S.enr = d.id; S.quiz = null; window.scrollTo(0,0); },
  detail: d => { const e = E(d.id); if (e.emp === S.viewer) { S.view = 'player'; } else { S.view = 'detail'; } S.enr = d.id; window.scrollTo(0,0); },
  reset: () => { seed(); S.view = homeFor(); S.mod = null; flash('Demo data reset.'); },
  pass: d => { const e = E(d.id), p = P(e.emp), m = M(e.mod); const note = (document.getElementById('note_' + e.id) || {}).value || '';
    e.handsOn = true; e.note = null; const fin = maybeComplete(e);
    log(`Hands-on check passed for ${p.name}: ${m.title}${note ? '. Note: ' + note : ''}`);
    flash(fin ? `${p.name} completed ${m.title}.` : `Sign-off recorded for ${p.name}.`); },
  needswork: d => { const e = E(d.id), p = P(e.emp), m = M(e.mod); const note = (document.getElementById('note_' + e.id) || {}).value.trim();
    if (!note) { flash('Add a note so the employee knows what to work on.'); return; }
    e.note = note; log(`Hands-on check marked needs work for ${p.name}: ${m.title}. Note: ${note}`);
    flash(`Marked needs work. ${p.name.split(' ')[0]} will see your note.`); },
  smsign: d => { const e = E(d.id), p = P(e.emp), m = M(e.mod);
    e.smSign = e.ip; const fin = maybeComplete(e);
    log(`Service Manager sign-off for ${p.name}: ${m.title}. Can complete all tasks without assistance.`);
    flash(fin ? `${p.name} completed ${m.title}.` : `Sign-off recorded. ${p.name.split(' ')[0]} still needs to pass the fresh quiz.`); },
  logip: d => { const e = E(d.id), p = P(e.emp), m = M(e.mod);
    e.ip += 1; log(`Logged in-person training #${e.ip} for ${p.name}: ${m.title}`);
    flash(`In-person training #${e.ip} logged. ${p.name.split(' ')[0]} can now take a fresh quiz.`); },
  extend: d => { const e = E(d.id), days = +document.getElementById('ext_days').value, reason = document.getElementById('ext_reason').value.trim();
    if (!reason) { flash('Enter a reason for the extension.'); return; }
    const old = e.due; e.due = addDays(e.due, days);
    log(`Extended due date for ${P(e.emp).name}: ${M(e.mod).title}, ${fmt(old)} → ${fmt(e.due)}. Reason: ${reason}`);
    flash(`New due date: ${fmt(e.due)}.`); },
  doenroll: () => { const f = S.ef, sc = scope().filter(id => id !== S.viewer);
    const already = id => DB.enr.some(e => e.emp === id && e.mod === f.mod);
    const ids = (f.by === 'role' ? sc.filter(id => P(id).role === f.role) : f.picks).filter(id => !already(id));
    ids.forEach(id => { const sm = smOf(id); DB.enr.push({id:'e' + (DB.enr.length + 1) + '_' + id, emp:id, mod:f.mod, assigned:TODAY, due:f.due, reviewer:f.reviewer || (sm ? sm.id : S.viewer), stepsDone:[], attempts:[], ip:0, smSign:0, handsOn:false, done:null}); });
    log(`Enrolled ${ids.map(id => P(id).name).join(', ')} in ${M(f.mod).title}, due ${fmt(f.due)}`);
    S.ef.picks = []; flash(`Enrolled ${ids.length} in ${M(f.mod).title}.`); },
  saveso: d => { const e = E(d.id), v = document.getElementById('so_' + e.id).value.trim();
    if (!v) { flash('Enter the SO number first.'); return; }
    e.so = v; log(`${P(e.emp).name} entered SO ${v} for ${M(e.mod).title}`); flash('SO number saved. The quiz is unlocked.'); },
  modopen: d => { S.mod = d.id; },
  modclose: () => { S.mod = null; },
  togglepub: d => { const m = M(d.id); m.status = m.status === 'Published' ? 'Draft' : 'Published'; log(`${m.status === 'Published' ? 'Published' : 'Moved to draft'}: ${m.title}`); flash(`${m.title} is now ${m.status.toLowerCase()}.`); },
  additem: d => { const m = M(d.id), type = document.getElementById('ni_type').value, text = document.getElementById('ni_text').value.trim();
    if (!text) { flash('Type the item text first.'); return; }
    const at = type === 'step' ? m.items.filter(i => i.type === 'step').length : m.items.length;
    m.items.splice(at, 0, {type, text}); m.version += 1; log(`Added ${type === 'step' ? 'a step' : 'a hands-on check'} to ${m.title} (now version ${m.version})`); flash('Item added.'); }
};

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const fn = ACT[t.dataset.act]; if (!fn) return;
  fn(t.dataset); render();
});

document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'viewer') { S.viewer = t.value; S.view = homeFor(); S.mod = null; S.ef = null; S.quiz = null; render(); window.scrollTo(0,0); return; }
  if (t.dataset.step !== undefined) {
    const e = E(t.dataset.id), i = +t.dataset.step;
    e.stepsDone = t.checked ? [...new Set([...e.stepsDone, i])] : e.stepsDone.filter(x => x !== i);
    render(); return;
  }
  if (t.dataset.ef) { S.ef[t.dataset.ef] = t.value; if (t.dataset.ef === 'mod') S.ef.due = addDays(TODAY, M(t.value).days); render(); return; }
  if (t.dataset.pick) { const id = t.dataset.pick; S.ef.picks = t.checked ? [...S.ef.picks, id] : S.ef.picks.filter(x => x !== id); render(); return; }
  if (t.dataset.access) { const p = P(t.dataset.access), old = p.access; p.access = t.value; log(`Changed access level for ${p.name}: ${old} → ${p.access}`); flash(`${p.name} is now ${p.access}.`); render(); return; }
  if (t.dataset.active) { const p = P(t.dataset.active); p.active = t.checked; log(`${p.active ? 'Reactivated' : 'Deactivated'} ${p.name}. Training history kept.`); flash(`${p.name} ${p.active ? 'reactivated' : 'deactivated'}.`); render(); return; }
});

document.addEventListener('submit', ev => {
  if (ev.target.id !== 'quizForm') return;
  ev.preventDefault();
  const e = E(ev.target.dataset.id), m = M(e.mod), qs = m.items.filter(i => i.type === 'quiz');
  const fd = new FormData(ev.target);
  if (qs.some((q,i) => !fd.get('q' + i))) { flash('Answer every question before submitting.'); return; }
  const right = qs.filter((q,i) => +fd.get('q' + i) === q.answer).length;
  const score = Math.round(right / qs.length * 100), pass = score >= 80;
  e.attempts.push({phase:e.ip, score, date:TODAY});
  const sm = smOf(e.emp), smName = sm ? sm.name : 'your Service Manager', p = P(e.emp);
  const used = phaseAtt(e, e.ip).length, limit = e.ip === 0 ? 2 : 1;
  let msg;
  if (pass) {
    const fin = maybeComplete(e);
    msg = fin ? 'Module complete.' : e.ip === 0 ? `Next: ${P(e.reviewer) ? P(e.reviewer).name : 'your reviewer'} watches you do the task live and signs off.` : `Next: ${smName} signs off that you can do every task without help.`;
  } else if (used < limit) {
    msg = `You need 80% to pass. You have ${limit - used} attempt left. Review the steps, then try again.`;
  } else if (e.ip < 2) {
    msg = `That was your last attempt for now. ${smName} will schedule in-person training with you.`;
    log(`${p.name} scored below 80% on ${m.title} (${phaseAtt(e, e.ip).map(a => a.score + '%').join(', ')}). Status set to Needs in-person training. ${p.name} and ${smName} notified.`);
  } else {
    msg = `Please see ${smName} about next steps.`;
    log(`${p.name} failed the quiz after the second in-person training (${score}%). Status set to Final attempt failed. ${smName} and admins notified.`, true);
  }
  S.quiz = {id:e.id, score, pass, msg};
  render(); window.scrollTo(0,0);
});

render();
</script>
