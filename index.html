<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fleet Span University</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
<style>
/* Layout: FleetSpan brand — black top strip, white brand bar, white side nav with yellow active rule, full-width working area.
   Single committed light theme mirroring fleetspan.com: black, white, FleetSpan yellow; green/red only for pass/overdue. */
:root{
  --black:#000000; --ink:#141414; --yellow:#FFC112; --yellow-deep:#E0A800; --white:#FFFFFF;
  --g50:#F5F5F3; --g100:#ECECE9; --g200:#DCDCD7; --g300:#CFCFCA; --g500:#8A8A85; --g600:#5F5F5A;
  --good:#1F7A45; --good-soft:#E3F2E8; --bad:#C2321F; --bad-soft:#FBE6E2; --warn-soft:#FFF6DC;
  --f:"Montserrat","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
html,body{background:var(--g50);color:var(--ink)}
body{font-family:var(--f);font-size:14.5px;line-height:1.55;font-weight:500}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:30px} h2{font-size:18px} h3{font-size:15px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--g600)}
.small{font-size:13px}
.eyebrow,.caps{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--g600);font-weight:700}

/* top strip + brand bar */
.strip{background:var(--black);color:var(--white);padding-block:9px;display:flex;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;font-size:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.strip b{color:var(--yellow);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.strip span{color:#D6D6D1}
.top{background:var(--white);border-bottom:1px solid var(--g100);padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:30px;width:auto;display:block}
.brand .uni{border-left:2px solid var(--black);padding-left:14px;font-weight:800;letter-spacing:.22em;font-size:13px}
.switch{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.switch label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--g600)}
select,input[type=text],input[type=date],input[type=number],textarea{background:var(--white);border:2px solid var(--black);border-radius:0;padding:8px 10px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
select{appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,#000 50%),linear-gradient(135deg,#000 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat}
select:disabled,input:disabled{border-color:var(--g300);color:var(--g600)}

/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 110px)}
nav.side{border-right:1px solid var(--g100);background:var(--white);padding:18px 0;display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;padding:10px 16px 10px 14px;cursor:pointer;color:var(--ink);font-weight:700;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase}
.navbtn:hover{background:var(--g50)}
.navbtn[aria-current="page"]{border-left-color:var(--yellow);background:var(--g50)}
.count{font-size:11.5px;background:var(--bad);color:#fff;padding:0 7px;line-height:20px;letter-spacing:0;min-width:20px;text-align:center}
.navgroup{margin:16px 18px 4px;color:var(--g500)!important}
main{padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1600px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.head p{color:var(--g600);margin-top:6px}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  nav.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--g100);padding:6px 8px;gap:2px}
  .navbtn{width:auto;white-space:nowrap;border-left:0;border-bottom:4px solid transparent;padding:10px 12px}
  .navbtn[aria-current="page"]{border-bottom-color:var(--yellow)}
  .navgroup{display:none}
}

/* module hero */
.hero{background:linear-gradient(90deg,#000 0%,#0b0b0b 60%,#1d1d1c 100%);color:var(--white);padding:28px 28px 30px;display:flex;flex-direction:column;gap:14px}
.hero .eyebrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--white)}
.hero .eyebrow .y{color:var(--yellow)}
.dashes{display:inline-flex;gap:8px}
.dashes i{display:block;width:26px;height:4px;background:var(--yellow)}
.herorow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.hero h1{font-size:clamp(26px,4vw,44px);max-width:22ch}
.hero .lead{color:#E6E6E3;max-width:70ch;font-size:15px}
.hero .lead b{color:var(--yellow)}

/* panels, tables */
.panel{background:var(--white);border:1px solid var(--g100);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ptitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tablewrap{overflow-x:auto;border:1px solid var(--g100);background:var(--white)}
.panel .tablewrap{border:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--g100);vertical-align:middle}
th{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--g600);font-weight:700;background:var(--white);white-space:nowrap;border-bottom:2px solid var(--black)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--warn-soft)}

/* status badges */
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;border:2px solid transparent;line-height:1.3}
.pill::before{content:"";width:7px;height:7px;background:currentColor;flex:none}
.s-notstarted{background:var(--g100);color:var(--g600)}
.s-progress{background:var(--white);color:var(--ink);border-color:var(--ink)}
.s-awaiting{background:var(--black);color:var(--white)}
.s-awaiting::before{background:var(--yellow)}
.s-needsIP{background:var(--yellow);color:var(--black)}
.s-overdue{background:var(--bad);color:var(--white)}
.s-completed{background:var(--good);color:var(--white)}
.s-late{background:var(--white);color:var(--good);border-color:var(--good)}
.s-final{background:var(--black);color:var(--yellow);border:2px dashed var(--yellow)}
.s-locked{background:var(--g100);color:var(--g500);border-color:var(--g300);border-style:dashed}
.s-contact{background:var(--white);color:var(--ink);border-color:var(--g300)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;background:var(--g100);color:var(--g600)}
.tag.internal{background:var(--black);color:var(--yellow)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border:2px solid var(--black);background:var(--white);color:var(--black);cursor:pointer;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border-radius:0}
.btn:hover{background:var(--g50)}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:var(--black)}
.btn.primary:hover{background:var(--yellow-deep);border-color:var(--yellow-deep)}
.btn.good{background:var(--black);border-color:var(--black);color:var(--white)}
.btn.good:hover{background:#2a2a28}
.btn.ghost{background:none;border-color:transparent;padding-inline:0;color:var(--ink)}
.btn.ghost:hover{text-decoration:underline;text-decoration-color:var(--yellow);text-decoration-thickness:3px;background:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1250px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:#34353A;color:var(--white);padding:16px 18px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .v{font-size:36px;font-weight:800;line-height:1;color:var(--yellow)}
.kpi .v.plain{color:var(--white)}
.kpi .l{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
.kpi .s{font-size:12.5px;color:#D2D2CE}
.kpi.alert{background:#B4513F}
.kpi.alert .v{color:var(--white)}
.kpi.alert .s{color:#FCEAE6}
.kpi .bar{height:5px;background:#55565B;margin-top:8px}
.kpi .bar i{display:block;height:100%;background:var(--yellow)}
.g2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.g2b{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.g2,.g2b{grid-template-columns:1fr}}

/* results by module */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.mrow{display:grid;grid-template-columns:minmax(150px,250px) minmax(0,1fr) 96px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--g100);cursor:default}
.mrow:last-child{border-bottom:0}
.mname{display:flex;flex-direction:column;min-width:0}
.mname b{font-weight:700}
.mname span{font-size:12px;color:var(--g600)}
.mbar{display:flex;gap:2px;height:18px}
.mbar i{display:block;height:100%}
.mval{text-align:right;font-size:13px;font-weight:700}
@media (max-width:600px){.mrow{grid-template-columns:1fr;gap:6px}.mval{text-align:left}}
.loc{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--g100)}
.loc:last-of-type{border-bottom:0}
.lt{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.lt span{font-weight:800;font-size:22px}
.lbar{height:10px;background:var(--g100)}
.lbar i{display:block;height:100%;background:var(--yellow)}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--g100);cursor:pointer}
ul.list li:hover{background:var(--warn-soft)}
ul.list li:last-child{border-bottom:0}
ul.list li > div{display:flex;flex-direction:column;min-width:0}
ul.list li > div span{font-size:13px;color:var(--g600)}
ul.list .rt{align-items:flex-end;text-align:right;flex:none}
ul.list .score{font-weight:800;font-size:18px;color:var(--good)!important}
ul.list .score.low{color:var(--bad)!important}
ul.list.due li{justify-content:flex-start}
ul.list.due li > div{flex:1}
.dd{font-weight:800;width:56px;flex:none;font-size:14px}

/* my training cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--white);border:1px solid var(--g100);border-top:4px solid var(--black);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;width:100%;border-radius:0}
.card:hover{border-top-color:var(--yellow)}
.card h3{font-size:16px}
.card .meta{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 16px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:none;border:0;padding:6px;cursor:pointer;font-size:12.5px;color:var(--g600);font-weight:600}
.bdg svg{width:136px;max-width:100%;height:auto;display:block}
.bdg:hover svg{transform:translateY(-2px)}
.bdg .got{color:var(--good);font-weight:700}
.bdg.big{cursor:default;padding:0}
.bdg.big svg{width:150px}
.lvl{display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:1px solid var(--g100)}
.ach{display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.ach svg{width:220px;max-width:100%;height:auto;flex:none}
.achtext{display:flex;flex-direction:column;gap:8px;flex:1 1 280px;min-width:0}
.achtext h2{font-size:28px}
details summary{cursor:pointer;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
details[open] summary{margin-bottom:12px}
.earned{flex-direction:row;align-items:center;flex-wrap:wrap;gap:20px;border-left:6px solid var(--good)}
.earnedtext{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 260px}
@media (prefers-reduced-motion:no-preference){.bdg svg{transition:transform .15s}}

/* player */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--g100)}
.steps li:last-child{border-bottom:0}
.steps input{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:0;border:2px solid var(--black);background:var(--white);display:grid;place-content:center;flex:none;cursor:pointer}
.steps input:checked{background:var(--yellow)}
.steps input:checked::before{content:"";width:10px;height:6px;border-left:2.5px solid #000;border-bottom:2.5px solid #000;transform:rotate(-45deg) translate(1px,-1px)}
.steps input:disabled{cursor:default}
.steps .n{font-weight:800;width:18px;flex:none;margin-top:1px}
.steps .done span.t{color:var(--g600)}
ul.guide{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.q{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--g100)}
.q:first-child{border-top:0}
.q select{width:100%;max-width:600px;padding:10px 34px 10px 12px}
.ql{display:block}
.sobox{border:2px solid var(--black);padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--white)}
.sobox .sohead{text-transform:uppercase;letter-spacing:.1em;font-size:12.5px}
.sogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.review{border:2px solid var(--black);background:var(--white);padding:14px;display:flex;flex-direction:column;gap:10px}
.rv{display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--g100);font-size:14px}
.rvx{color:var(--bad);font-weight:700}
.rvok{color:var(--good);font-weight:700}
.soin{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--g600)}
.soin input{width:100%;font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink)}
.callout{padding:12px 14px;display:flex;flex-direction:column;gap:3px;font-size:14px;border-left:6px solid;background:var(--white)}
.callout > b{text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.callout.info{border-color:var(--black);background:var(--g50)}
.callout.good{border-color:var(--good);background:var(--good-soft)}
.callout.warn{border-color:var(--yellow);background:var(--warn-soft)}
.callout.bad{border-color:var(--bad);background:var(--bad-soft)}
.callout.internal{border-color:var(--yellow);background:var(--black);color:var(--white)}
.callout.internal > b{color:var(--yellow)}
.locked{opacity:.5}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px 20px}
.facts div span{display:block}
.facts .k{font-size:11.5px;color:var(--g600);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--black);color:var(--white);border-left:6px solid var(--yellow);padding:12px 18px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5}
.cell{background:none;border:0;padding:0;cursor:pointer}
.empty{color:var(--g600);padding:18px;text-align:center;border:2px dashed var(--g300);background:var(--white)}
.fieldgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.checklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.checklist label{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--g200);cursor:pointer;background:var(--white)}
.checklist input{accent-color:#000}
.checklist label.off{opacity:.5;cursor:not-allowed}
.email{border:1px solid var(--g100);background:var(--white)}
.email .eh{background:var(--black);color:var(--yellow);padding:12px 16px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between}
.email .eh span{color:var(--white)}
.email .eb{padding:16px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
@media (prefers-reduced-motion:no-preference){.btn,.card,.navbtn{transition:background .15s,border-color .15s}}
</style>


</head>
<body>

const phaseAtt = (e,ph) => e.attempts.filter(a => a.phase === ph);

    const inLevel = mine.filter(e => M(e.mod).level === l), doneDate = levelDone(v.id, l);

      html += `<div class="lvl"><div class="ach">${achievementSvg(l, mods.length, v.id + l)}<div class="achtext"><span class="caps" style="color:var(--good)">Achievement earned · ${fmt(doneDate)}</span><h2>${esc(LEVEL_NAME[l])}</h2><p>You completed all ${mods.length} ${esc(LEVEL_NAME[l])} modules.${LEVELS[i + 1] && levelMods(LEVELS[i + 1], v.role).length ? ` ${esc(LEVEL_NAME[LEVELS[i + 1]])} modules are now unlocked.` : ''}</p>

      <div class="row"><button class="btn primary" type="submit">Submit answers</button></div></form>`;
  } else {
    quizBlock = `<p class="muted">The quiz is available to the employee.</p>`;
  }

  let signBlock;
  if (e.ip === 0 && !hasSignoff(e)) {
    signBlock = `<p class="muted">This module has no sign-off check. Passing the quiz completes it.</p>`;
  } else if (e.ip === 0) {
    signBlock = e.handsOn ? `<div class="callout good"><b>Hands-on check passed</b><span>Signed off by ${esc(rev ? rev.name : 'reviewer')}.</span></div>`
      : `<p>${esc(so ? so.text : '')}</p><p class="small muted">Reviewer: <b>${esc(rev ? rev.name : 'Not set')}</b>. ${quizPassed(e) ? 'Waiting for the reviewer to watch the task and sign off.' : 'Unlocks after you pass the quiz.'}</p>${e.note ? `<div class="callout warn"><b>Reviewer note</b><span>${esc(e.note)}</span></div>` : ''}`;
  } else {
    signBlock = e.smSign >= e.ip ? `<div class="callout good"><b>Service Manager sign-off recorded</b><span>${esc(sm ? sm.name : '')} confirmed you can complete all tasks without assistance.</span></div>`
      : `<p>After in-person training, ${esc(sm ? sm.name : 'your Service Manager')} signs off that you can complete all tasks without assistance.</p>`;
  }

  return `<div><button class="btn ghost" type="button" data-act="go" data-v="mytraining">← My Training</button></div>
  <div class="hero"><div class="eyebrow"><span class="dashes"><i></i><i></i><i></i></span><span>${esc(m.roles.join(', '))}</span><span>•</span><span>${m.tier}</span><span>•</span><span class="y">Due ${fmt(e.due)}</span><span>•</span><span>Assigned ${fmt(e.assigned)}</span></div>
    <div class="herorow"><h1>${esc(m.title)}</h1>${pill(s)}</div>
    ${m.why ? `<p class="lead"><b>Why it matters:</b> ${rich(m.why)}</p>` : ''}</div>
  ${lk ? `<div class="callout warn"><b>Locked</b><span>This is a ${esc(LEVEL_NAME[m.level])} module. It unlocks when you finish every ${esc(prevName)} module.</span></div>` : ''}
  ${e.done ? `<section class="panel earned"><div class="bdg big">${badgeSvg(e, true)}</div><div class="earnedtext"><span class="caps" style="color:var(--good)">Badge earned</span><h2>${esc(m.title)}</h2><p>Completed ${fmt(e.done)}${e.done > e.due ? ' (after the ' + fmt(e.due) + ' due date)' : ''} · best quiz score ${bestScore(e)}%.</p><p class="small muted">${mineView ? 'This badge now shows in My badges on your My Training page.' : 'This badge shows in My badges on the employee\'s My Training page.'}</p></div></section>` : ''}
  <div class="split">
    <section class="panel">
      ${m.before ? `<div><h3>Before you start</h3><ul class="guide">${m.before.map(b => `<li>${rich(b)}</li>`).join('')}</ul></div>` : ''}
      <div class="row" style="justify-content:space-between"><h2>1. Steps</h2><span class="mono small muted">${e.stepsDone.length}/${steps.length}</span></div>
      <p class="small muted">Do the steps in order, and do them with your trainer watching the first time.</p>
      <ol class="steps">${steps.map((st2,i) => { const d = e.stepsDone.includes(i); return `<li class="${d ? 'done' : ''}"><input type="checkbox" id="st_${e.id}_${i}" data-step="${i}" data-id="${e.id}" ${d ? 'checked' : ''} ${(!mineView || locked) ? 'disabled' : ''}><span class="n">${i + 1}</span><label for="st_${e.id}_${i}"><span class="t">${rich(st2.text)}</span></label></li>`; }).join('')}</ol>
      ${soNeed(e) ? `<div class="sobox"><b class="sohead">SO numbers · ${soNeed(e)} required</b><p class="small muted">Type the number of ${soNeed(e) === 1 ? 'the SO' : 'each SO'} you completed these steps on. Your trainer uses ${soNeed(e) === 1 ? 'it' : 'them'} to check your work.</p>
        <div class="sogrid">${Array.from({length: soNeed(e)}, (_, i) => `<label class="soin"><span>SO ${i + 1}</span><input type="text" id="so_${e.id}_${i}" value="${esc(soList(e)[i] || '')}" placeholder="SO number" inputmode="numeric" ${(!mineView || locked) ? 'disabled' : ''}></label>`).join('')}</div>
        ${mineView && !locked ? `<div class="row"><button class="btn" type="button" data-act="saveso" data-id="${e.id}">Save SO numbers</button><span class="small muted">${soList(e).length} of ${soNeed(e)} entered</span></div>` : ''}</div>` : ''}
      ${m.doneRight ? `<div class="callout good"><b>Done right looks like</b><span>${rich(m.doneRight)}</span></div>` : ''}
      ${m.wrong ? `<div><h3>If something goes wrong</h3><ul class="guide">${m.wrong.map(w => `<li>${rich(w)}</li>`).join('')}</ul></div>` : ''}
      ${m.sources ? `<p class="small muted">Full article in Fullbay Help & Training: ${m.sources.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener" style="color:var(--ink);font-weight:700">${esc(x.title)}</a>`).join(' · ')}</p>` : ''}
    </section>
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <section class="panel ${!stepsComplete(e) ? 'locked' : ''}"><h2>2. Quiz</h2>${result}${quizBlock}</section>
      <section class="panel ${!quizPassed(e) && !e.done ? 'locked' : ''}"><h2>3. ${e.ip ? 'Service Manager sign-off' : 'Sign-off check'}</h2>${signBlock}</section>
    </div>
  </div>`;
}

function vQueue(){

    const smType = e.ip > 0;
    return `<section class="panel">
      <div class="row" style="justify-content:space-between"><div><h3>${esc(p.name)} · ${esc(m.title)}</h3><p class="small muted">${esc(p.role)} · Due <span class="mono">${fmt(e.due)}</span> · Quiz ${bestScore(e)}%</p><p class="small">SO number${(e.so || '').includes(',') ? 's' : ''}: <b class="mono">${esc(e.so || 'Not entered')}</b></p></div>${smType ? '<span class="tag">After in-person training</span>' : '<span class="tag">Hands-on check</span>'}</div>
      <p><b>${smType ? 'Confirm the employee can complete all tasks without assistance.' : esc(so ? so.text : '')}</b></p>

function scopedEnr(){ const sc = scope(); return DB.enr.filter(e => sc.includes(e.emp) && e.emp !== S.viewer && P(e.emp).active); }

function vDashboard(){
  const en = scopedEnr();
  const isDue = e => e.due <= TODAY || e.done;
  const due = en.filter(isDue), done = en.filter(e => e.done);
  const doneDue = done.filter(isDue);
  const ontime = done.filter(e => e.done <= e.due);
  const comp = pct(doneDue.length, due.length), on = pct(ontime.length, done.length);
  const avg = done.length ? Math.round(done.reduce((s,e) => s + bestScore(e), 0) / done.length) : null;
  const tried = en.filter(e => phaseAtt(e,0).length), first = tried.filter(e => phaseAtt(e,0)[0].score >= 80);
  const fpr = pct(first.length, tried.length);
  const q = queueItems();
  const overdue = en.filter(e => status(e) === 'overdue').length, needs = en.filter(e => ['needsIP','final'].includes(status(e))).length;
  const kpi = (v,l,sub,bar,cls) => `<div class="kpi ${cls || ''}"><span class="v mono ${bar === undefined && !cls ? 'plain' : ''}">${v}</span><span class="l">${l}</span><span class="s">${sub}</span>${bar !== undefined ? `<div class="bar"><i style="width:${bar}%"></i></div>` : ''}</div>`;

  // results by module
  const CAT = [['c','Completed','#1F7A45'],['a','Awaiting sign-off','#000000'],['p','In progress','#8A8A85'],['n','Not started','#DCDCD7'],['f','Needs in-person or failed','#FFC112'],['o','Overdue','#C2321F']];
  const catOf = e => { const s = status(e); return lockedFor(e) ? 'n' : {completed:'c', late:'c', awaiting:'a', progress:'p', notstarted:'n', needsIP:'f', final:'f', overdue:'o'}[s]; };
  const mods = DB.modules.filter(m => en.some(e => e.mod === m.id));
  const max = Math.max(1, ...mods.map(m => en.filter(e => e.mod === m.id).length));
  const modRows = mods.map(m => { const me2 = en.filter(e => e.mod === m.id);
    const segs = CAT.map(([k,lab,col]) => { const v = me2.filter(e => catOf(e) === k).length; return v ? `<i style="width:${(v/max*100).toFixed(2)}%;background:${col}" title="${lab}: ${v}"></i>` : ''; }).join('');
    return `<div class="mrow"><div class="mname"><b>${esc(m.title)}</b><span>${esc(m.roles.join(', '))}${m.roles[0] === 'Tech' ? ' · ' + m.tier : ''}</span></div><div class="mbar" role="img" aria-label="${esc(m.title)}: ${CAT.map(([k,lab]) => lab + ' ' + me2.filter(e => catOf(e) === k).length).join(', ')}">${segs}</div><div class="mval mono">${me2.filter(e => e.done).length} of ${me2.length} done</div></div>`; }).join('');
  const legend = CAT.map(([k,lab,col]) => `<span><i style="background:${col}"></i>${lab}</span>`).join('');

  // by location
  const locs = [...new Set(en.map(e => P(e.emp).loc))];
  const locStats = locs.map(l => { const le = en.filter(e => P(e.emp).loc === l), ld = le.filter(isDue), lc = ld.filter(e => e.done);
    return {l, n:le.length, due:ld.length, done:lc.length, rate:pct(lc.length, ld.length), bad:ld.filter(e => ['overdue','needsIP','final'].includes(status(e))).length}; });
  const worst = locStats.filter(x => x.rate !== null).sort((a,b) => a.rate - b.rate)[0];
  const locHtml = locStats.map(x => `<div class="loc"><div class="lt"><b>${esc(x.l)}</b><span class="mono">${x.rate === null ? '—' : x.rate + '%'}</span></div><div class="lbar"><i style="width:${x.rate || 0}%"></i></div><span class="small muted">${x.done} of ${x.due} due modules complete · ${x.n} enrolled</span></div>`).join('');
  const locAlert = locStats.length > 1 && worst && worst.rate < 60 && worst.bad ? `<div class="callout warn"><b>${esc(worst.l)} is behind</b><span>${worst.bad} of its ${worst.due} due modules ${worst.bad === 1 ? 'is' : 'are'} overdue or need in-person training.</span></div>` : '';

  // attention, roles, recent, upcoming
  const attention = en.filter(e => ['final','needsIP','overdue','awaiting'].includes(status(e))).sort((a,b) => RANK[status(a)] - RANK[status(b)]);
  const roles = [...new Set(en.map(e => P(e.emp).role))];
  const roleRows = roles.map(r => { const re = en.filter(e => P(e.emp).role === r), rd = re.filter(e => e.done), rdue = re.filter(isDue);
    const ra = rd.length ? Math.round(rd.reduce((s,e) => s + bestScore(e), 0) / rd.length) + '%' : '—';
    const rr = pct(rd.filter(isDue).length, rdue.length);
    return `<tr><td><b>${esc(r)}</b></td><td class="num">${re.length}</td><td class="num">${rd.length}</td><td class="num">${rr === null ? '—' : rr + '%'}</td><td class="num">${re.filter(e => status(e) === 'overdue').length}</td><td class="num">${ra}</td></tr>`; }).join('');
  const recent = done.slice().sort((a,b) => b.done.localeCompare(a.done)).slice(0, 6);
  const upcoming = en.filter(e => !e.done && e.due >= TODAY && e.due <= addDays(TODAY, 14)).sort((a,b) => a.due.localeCompare(b.due)).slice(0, 8);
  const who = lvl() === 'Admin' ? 'Company-wide' : `${esc(me().name)}'s team`;

  return `<div class="head"><div><h1>Dashboard</h1><p>${who} · as of <span class="mono">${fmt(TODAY)}, 2026</span></p></div></div>
  <div class="kpis">
    ${kpi(comp === null ? '—' : comp + '%', 'Completion rate', `${doneDue.length} of ${due.length} due modules complete`, comp ?? 0)}
    ${kpi(on === null ? '—' : on + '%', 'On-time rate', `${ontime.length} of ${done.length} finished by the due date`, on ?? 0)}
    ${kpi(fpr === null ? '—' : fpr + '%', 'First-try pass rate', `${first.length} of ${tried.length} passed on attempt 1`, fpr ?? 0)}
    ${kpi(avg === null ? '—' : avg + '%', 'Average score', 'Best quiz score, completed modules', avg ?? 0)}
    ${kpi(q.length, 'Sign-offs waiting', q.length ? esc(q.map(e => P(e.emp).name).join(' · ')) : 'None right now')}
    ${kpi(overdue + needs, 'Need attention', `${overdue} overdue · ${needs} in-person or failed`, undefined, overdue + needs ? 'alert' : '')}
  </div>
  <div class="g2">
    <section class="panel"><div class="ptitle"><h2>Results by module</h2><span class="caps">${en.length} enrollments</span></div>
      <div class="legend">${legend}</div><div>${modRows || '<div class="empty">No enrollments yet.</div>'}</div></section>
    <section class="panel"><div class="ptitle"><h2>By location</h2><span class="caps">Completion rate</span></div>${locHtml}${locAlert}</section>
  </div>
  <div class="g2b">
    <section class="panel"><div class="ptitle"><h2>Needs attention</h2><span class="caps">${attention.length} open</span></div>
      ${attention.length ? `<div class="tablewrap"><table><thead><tr><th>Employee</th><th>Module</th><th>Due</th><th>Status</th></tr></thead><tbody>
      ${attention.map(e => `<tr class="click" data-act="detail" data-id="${e.id}"><td><b>${esc(P(e.emp).name)}</b></td><td>${esc(M(e.mod).title)}</td><td class="mono">${fmt(e.due)}</td><td>${pill(shown(e))}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">Nothing needs attention.</div>'}</section>
    <section class="panel"><div class="ptitle"><h2>By job role</h2></div>
      <div class="tablewrap"><table><thead><tr><th>Role</th><th class="num">Enrolled</th><th class="num">Done</th><th class="num">Rate</th><th class="num">Late</th><th class="num">Avg</th></tr></thead><tbody>${roleRows}</tbody></table></div>
      <p class="small muted">Rate = completed ÷ modules that are due. Late = overdue right now.</p></section>
  </div>
  <div class="g2b">
    <section class="panel"><div class="ptitle"><h2>Recent results</h2><span class="caps">Latest ${recent.length}</span></div>
      ${recent.length ? `<ul class="list">${recent.map(e => `<li data-act="detail" data-id="${e.id}"><div><b>${esc(P(e.emp).name)}</b><span>${esc(M(e.mod).title)}</span></div><div class="rt"><span class="score mono ${bestScore(e) < 80 ? 'low' : ''}">${bestScore(e)}%</span><span class="mono">${fmt(e.done)}${e.done > e.due ? ' · late' : ''}</span></div></li>`).join('')}</ul>` : '<div class="empty">No completed modules yet.</div>'}</section>
    <section class="panel"><div class="ptitle"><h2>Due in the next 14 days</h2><span class="caps">${upcoming.length} module${upcoming.length === 1 ? '' : 's'}</span></div>
      ${upcoming.length ? `<ul class="list due">${upcoming.map(e => `<li data-act="detail" data-id="${e.id}"><span class="dd mono">${fmt(e.due)}</span><div><b>${esc(P(e.emp).name)}</b><span>${esc(M(e.mod).title)}</span></div>${pill(shown(e))}</li>`).join('')}</ul>` : '<div class="empty">Nothing due in the next 14 days.</div>'}</section>
  </div>`;
}

function vTeam(){

  const en = DB.enr.filter(e => sc.includes(e.emp));
  const mods = DB.modules.filter(m => en.some(e => e.mod === m.id));

  ${ppl.map(p => `<tr><td><b>${esc(p.name)}</b><div class="small muted">${esc(p.loc)}</div></td><td>${esc(p.role)}</td>${mods.map(m => { const e = en.find(x => x.emp === p.id && x.mod === m.id);

  const hist = e.attempts.map(a => { const label = a.phase === 0 ? phaseName(0, ++n0) : phaseName(a.phase); return `<tr><td>${label}</td><td class="mono">${fmt(a.date)}</td><td class="num">${a.score}%</td><td>${a.score >= 80 ? '<span class="pill s-completed">Pass</span>' : '<span class="pill s-overdue">Below 80%</span>'}</td><td>${a.missed ? (a.missed.length ? a.missed.map(([i]) => 'Q' + (i + 1)).join(', ') : 'None') : '—'}</td></tr>`; }).join('');

  const related = DB.audit.filter(a => a.what.includes(p.name) && a.what.includes(m.title) && (!a.internal || canSeeFinal(e)));

  ${st === 'final' && canSeeFinal(e) ? `<div class="callout internal"><span><span class="tag internal">Internal only</span></span><b>Failed after the second in-person training.</b><span>Per shop policy, this goes to management for a decision. The employee sees only "See your Service Manager." Admins and ${esc(sm ? sm.name : 'the Service Manager')} are the only people who can see this status.</span></div>` : ''}
  <section class="panel"><div class="facts">

    <div><span class="k">Due</span><span class="mono">${fmt(e.due)}</span></div>
    <div><span class="k">Steps</span><span class="mono">${e.stepsDone.length} of ${stepsTotal(e)}</span></div>
    <div><span class="k">Best score</span><span class="mono">${bestScore(e) ?? '—'}${bestScore(e) !== null ? '%' : ''}</span></div>
    <div><span class="k">In-person sessions</span><span class="mono">${e.ip} of 2</span></div>
    <div><span class="k">Reviewer</span><span>${esc(rev ? rev.name : '—')}</span></div>
    <div><span class="k">SO number</span><span class="mono">${esc(e.so || '—')}</span></div>
  </div>
  ${actions.length ? `<div class="row">${actions.join('')}</div>` : ''}</section>
  ${e.done ? `<section class="panel earned"><div class="bdg big">${badgeSvg(e, true)}</div><div class="earnedtext"><span class="caps" style="color:var(--good)">Badge earned</span><h2>${esc(p.name)}</h2><p>Earned ${fmt(e.done)} · best quiz score ${bestScore(e)}%.</p><p class="small muted">Shows in My badges on ${esc(p.name.split(' ')[0])}'s My Training page.</p></div></section>` : ''}
  <div class="split">
    <section class="panel"><h2>Quiz attempts</h2>${e.attempts.length ? `<div class="tablewrap"><table><thead><tr><th>Attempt</th><th>Date</th><th class="num">Score</th><th>Result</th><th>Missed</th></tr></thead><tbody>${hist}</tbody></table></div>` : '<div class="empty">No attempts yet.</div>'}
      <p class="small muted">Rules: 2 online attempts at 80%. Below that, in-person training, then a Service Manager sign-off and 1 fresh quiz. One more round if needed.</p>
      ${related.length ? `<h3>History</h3><div class="tablewrap"><table><tbody>${related.map(a => `<tr><td class="mono small">${fmt(a.date)}</td><td class="small">${esc(a.what)} ${a.internal ? '<span class="tag internal">Internal</span>' : ''}</td></tr>`).join('')}</tbody></table></div>` : ''}
    </section>
    ${!e.done ? `<section class="panel"><h2>Extend due date</h2>

      <div class="field"><label for="ext_reason">Reason</label><input type="text" id="ext_reason" placeholder="Required, e.g. out on PTO"></div>
      <div class="row"><button class="btn" type="button" data-act="extend" data-id="${e.id}">Extend</button></div>
      <p class="small muted">Extensions are logged with your name and reason.</p></section>` : ''}
  </div>`;
}

function vEnroll(){
  const sc = scope().filter(id => id !== S.viewer && P(id).active);
  const pub = DB.modules.filter(m => m.status === 'Published');
  if (!S.ef) S.ef = {by:'role', role:'Tech', mod:'t4', due:addDays(TODAY, 14), reviewer:'', picks:[]};
  const f = S.ef, m = M(f.mod);
  const roles = [...new Set(sc.map(id => P(id).role))];
  if (!roles.includes(f.role)) f.role = roles[0];
  const already = id => DB.enr.some(e => e.emp === id && e.mod === f.mod);
  const pool = sc.map(P).filter(p => f.by === 'role' ? p.role === f.role : true);
  const targets = f.by === 'role' ? pool.filter(p => !already(p.id)) : pool.filter(p => f.picks.includes(p.id) && !already(p.id));
  const reviewers = DB.people.filter(p => (sc.includes(p.id) || p.id === S.viewer) && ['Reviewer','Manager','Admin'].includes(p.access));
  return `<div class="head"><div><h1>Enroll</h1><p>Assign a published module by job role or to specific people${lvl() === 'Manager' ? ' on your team' : ''}.</p></div></div>
  <section class="panel">
    <div class="fieldgrid">
      <div class="field"><label for="ef_mod">Module</label><select id="ef_mod" data-ef="mod">${pub.map(x => `<option value="${x.id}" ${x.id === f.mod ? 'selected' : ''}>${esc(x.title)} (${esc(x.roles.join(', '))})</option>`).join('')}</select></div>
      <div class="field"><label for="ef_by">Enroll by</label><select id="ef_by" data-ef="by"><option value="role" ${f.by === 'role' ? 'selected' : ''}>Job role</option><option value="people" ${f.by === 'people' ? 'selected' : ''}>Pick people</option></select></div>
      ${f.by === 'role' ? `<div class="field"><label for="ef_role">Job role</label><select id="ef_role" data-ef="role">${roles.map(r => `<option ${r === f.role ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></div>` : ''}
      <div class="field"><label for="ef_due">Due date</label><input type="date" id="ef_due" data-ef="due" value="${f.due}"></div>
      <div class="field"><label for="ef_rev">Hands-on reviewer</label><select id="ef_rev" data-ef="reviewer"><option value="">Employee's Service Manager</option>${reviewers.map(r => `<option value="${r.id}" ${r.id === f.reviewer ? 'selected' : ''}>${esc(r.name)} (${r.access})</option>`).join('')}</select></div>
    </div>
    <p class="small muted">Default due date for this module: ${m.days} days after assignment.</p>
    <div class="checklist">${pool.map(p => { const a = already(p.id), on = f.by === 'role' ? !a : f.picks.includes(p.id);
      return `<label class="${a ? 'off' : ''}"><input type="checkbox" id="pk_${p.id}" data-pick="${p.id}" ${on && !a ? 'checked' : ''} ${a || f.by === 'role' ? 'disabled' : ''}><span>${esc(p.name)}<span class="small muted"> · ${a ? 'already enrolled' : esc(p.role)}</span></span></label>`; }).join('') || '<span class="muted">No one matches.</span>'}</div>
    <div class="row"><button class="btn primary" type="button" data-act="doenroll" ${targets.length ? '' : 'disabled'}>Enroll ${targets.length} ${targets.length === 1 ? 'person' : 'people'}</button></div>
  </section>`;
}

function reminderList(){
  const sc = scope();
  const out = [];
  DB.enr.filter(e => sc.includes(e.emp) && !e.done).forEach(e => {
    const p = P(e.emp), sm = smOf(e.emp), to = [p.name, sm && sm.id !== p.id ? sm.name : null].filter(Boolean).join(', ');
    const pre = addDays(e.due, -1), post = addDays(e.due, 1);
    if (pre >= e.assigned) out.push({date:pre, kind:'Due tomorrow', e, to});
    out.push({date:post, kind:'Overdue', e, to});
  });
  return out.sort((a,b) => a.date.localeCompare(b.date));
}
function vReminders(){
  const list = reminderList(), upcoming = list.filter(r => r.date > TODAY), sent = list.filter(r => r.date <= TODAY).reverse();
  const row = r => `<tr class="click" data-act="detail" data-id="${r.e.id}"><td class="mono">${fmt(r.date)}</td><td>${r.kind === 'Overdue' ? '<span class="pill s-overdue">Day after due</span>' : '<span class="pill s-progress">1 day before</span>'}</td><td>${esc(M(r.e.mod).title)}</td><td>${esc(r.to)}</td></tr>`;
  const ex = upcoming[0] || sent[0];
  const sample = ex ? `Subject: ${ex.kind === 'Overdue' ? 'Overdue' : 'Due tomorrow'}: ${M(ex.e.mod).title}

Hi ${P(ex.e.emp).name.split(' ')[0]},

Your training module "${M(ex.e.mod).title}" ${ex.kind === 'Overdue' ? 'was due ' + fmt(ex.e.due) + ' and is not finished yet' : 'is due ' + fmt(ex.e.due)}.

Open Fleet Span University and sign in with your Microsoft account to continue.

Copy: ${smOf(ex.e.emp) ? smOf(ex.e.emp).name : 'Service Manager'} (Service Manager)` : '';
  return `<div class="head"><div><h1>Reminders</h1><p>Emails go to the employee and their Service Manager 1 day before the due date, and the day after if the module isn't finished.</p></div></div>
  <div class="split">
    <section class="panel"><h2>Scheduled</h2>${upcoming.length ? `<div class="tablewrap"><table><thead><tr><th>Sends</th><th>Type</th><th>Module</th><th>To</th></tr></thead><tbody>${upcoming.map(row).join('')}</tbody></table></div>` : '<div class="empty">Nothing scheduled.</div>'}
      <p class="small muted">A day-after reminder is cancelled automatically if the module is finished first.</p>
      <h2>Sent</h2>${sent.length ? `<div class="tablewrap"><table><thead><tr><th>Sent</th><th>Type</th><th>Module</th><th>To</th></tr></thead><tbody>${sent.map(row).join('')}</tbody></table></div>` : '<div class="empty">None sent yet.</div>'}</section>
    <section class="panel"><h2>Example email</h2><div class="email"><div class="eh">Fleet Span University<span>Reminder</span></div><div class="eb">${esc(sample)}</div></div></section>
  </div>`;
}

function vModules(){
  if (S.mod) {
    const m = M(S.mod);
    const tcount = t => m.items.filter(i => i.type === t).length;
    return `<div><button class="btn ghost" type="button" data-act="modclose">← All modules</button></div>
    <div class="head"><div><span class="tag">${esc(m.roles.join(', '))} · ${m.tier} · Version ${m.version}</span><h1 style="margin-top:6px">${esc(m.title)}</h1><p>${tcount('step')} steps · ${tcount('quiz')} quiz questions · ${tcount('signoff')} hands-on check · Passing score 80% · ${m.days} days to complete</p></div>
      <button class="btn ${m.status === 'Published' ? '' : 'primary'}" type="button" data-act="togglepub" data-id="${m.id}">${m.status === 'Published' ? 'Move back to draft' : 'Publish'}</button></div>
    ${m.why ? `<div class="callout info"><b>Why it matters</b><span>${rich(m.why)}</span></div>` : ''}
    <section class="panel"><h2>Items</h2>
      <div class="tablewrap"><table><thead><tr><th>#</th><th>Type</th><th>Content</th></tr></thead><tbody>
      ${m.items.map((it,i) => `<tr><td class="mono">${i + 1}</td><td><span class="tag">${it.type === 'step' ? 'Step' : it.type === 'quiz' ? 'Quiz' : 'Hands-on'}</span></td><td>${it.type === 'quiz' ? esc(it.q) : rich(it.text)}${it.type === 'quiz' ? `<div class="small muted">Answer: ${esc(it.options[it.answer])}</div>` : ''}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="fieldgrid">
        <div class="field"><label for="ni_type">Add item</label><select id="ni_type"><option value="step">Step</option><option value="signoff">Hands-on check</option></select></div>
        <div class="field" style="grid-column:span 2"><label for="ni_text">Text</label><input type="text" id="ni_text" placeholder="e.g. Attach photos to the inspection"></div>
      </div>
      <div class="row"><button class="btn" type="button" data-act="additem" data-id="${m.id}">Add item</button></div>
    </section>
    ${m.items.some(i => i.type === 'quiz') ? `<section class="panel"><h2>Quiz preview</h2><p class="small muted">What the employee sees. Each question is a dropdown; 80% to pass.</p><form>${quizFields(m.items.filter(i => i.type === 'quiz'), 'pv' + m.id, false)}</form></section>` : ''}`;
  }
  return `<div class="head"><div><h1>Modules</h1><p>Only admins create and edit modules. Only published modules can be assigned.</p></div></div>
  <div class="tablewrap"><table><thead><tr><th>Module</th><th>Job roles</th><th>Tier</th><th class="num">Items</th><th class="num">Enrolled</th><th>Status</th></tr></thead><tbody>
  ${DB.modules.map(m => `<tr class="click" data-act="modopen" data-id="${m.id}"><td><b>${esc(m.title)}</b></td><td>${esc(m.roles.join(', '))}</td><td>${m.tier}</td><td class="num">${m.items.length}</td><td class="num">${DB.enr.filter(e => e.mod === m.id).length}</td><td>${m.status === 'Published' ? '<span class="pill s-completed">Published</span>' : '<span class="pill s-notstarted">Draft</span>'}</td></tr>`).join('')}
  </tbody></table></div>`;
}

function vRoster(){
  return `<div class="head"><div><h1>Roster</h1><p>Microsoft confirms who someone is. This roster decides what they can do. People are deactivated, never deleted, so their training history stays.</p></div></div>
  <div class="tablewrap"><table><thead><tr><th>Name</th><th>Job role</th><th>Access level</th><th>Location</th><th>Reports to</th><th>Active</th></tr></thead><tbody>
  ${DB.people.map(p => `<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.role)}</td><td><select id="acc_${p.id}" data-access="${p.id}" aria-label="Access level for ${esc(p.name)}" ${p.id === S.viewer ? 'disabled' : ''}>${['Admin','Manager','Reviewer','Employee'].map(a => `<option ${a === p.access ? 'selected' : ''}>${a}</option>`).join('')}</select></td><td>${esc(p.loc)}</td><td>${esc(p.mgr ? P(p.mgr).name : '—')}</td><td><input type="checkbox" id="act_${p.id}" data-active="${p.id}" ${p.active ? 'checked' : ''} ${p.id === S.viewer ? 'disabled' : ''} aria-label="Active"></td></tr>`).join('')}
  </tbody></table></div>`;
}

function vAudit(){
  return `<div class="head"><div><h1>Audit log</h1><p>Sign-offs, in-person training, due date changes, access changes and status escalations.</p></div></div>
  <div class="tablewrap"><table><thead><tr><th>Date</th><th>By</th><th>What changed</th></tr></thead><tbody>
  ${DB.audit.map(a => `<tr><td class="mono">${fmt(a.date)}</td><td>${esc(a.who)}</td><td>${esc(a.what)} ${a.internal ? '<span class="tag internal">Internal</span>' : ''}</td></tr>`).join('')}
  </tbody></table></div>`;
}

const VIEWS = {mytraining:vMyTraining, player:vPlayer, queue:vQueue, dashboard:vDashboard, team:vTeam, detail:vDetail, enroll:vEnroll, reminders:vReminders, modules:vModules, roster:vRoster, audit:vAudit};

function render(){
  if (!allowed(S.view)) { S.view = homeFor(); }
  const sel = document.getElementById('viewer');
  const opts = [['dana','Admin'],['marcus','Service Manager'],['priya','Service Manager'],['gus','Reviewer'],['luis','Tech'],['jake','Tech']];
  sel.innerHTML = opts.map(([id,t]) => `<option value="${id}" ${id === S.viewer ? 'selected' : ''}>${t} · ${esc(P(id).name)}</option>`).join('');
  renderNav();
  document.getElementById('main').innerHTML = `<div class="wrap">${VIEWS[S.view]()}</div>`;
}
function flash(msg){ const f = document.getElementById('flash'); f.textContent = msg; f.hidden = false; clearTimeout(S.flashT); S.flashT = setTimeout(() => { f.hidden = true; }, 3200); }

/* ---------- actions ---------- */
const ACT = {
  go: d => { S.view = d.v; S.mod = null; window.scrollTo(0,0); },
  open: d => { S.view = 'player'; S.enr = d.id; S.quiz = null; window.scrollTo(0,0); },
  detail: d => { const e = E(d.id); if (e.emp === S.viewer) { S.view = 'player'; } else { S.view = 'detail'; } S.enr = d.id; window.scrollTo(0,0); },
  reset: () => { seed(); S.view = homeFor(); S.mod = null; flash('Demo data reset.'); },
  pass: d => { const e = E(d.id), p = P(e.emp), m = M(e.mod); const note = (document.getElementById('note_' + e.id) || {}).value || '';
    e.handsOn = true; e.note = null; const fin = maybeComplete(e);
    log(`Hands-on check passed for ${p.name}: ${m.title}${note ? '. Note: ' + note : ''}`);
    flash(fin ? `${p.name} completed ${m.title}.` : `Sign-off recorded for ${p.name}.`); },
  needswork: d => { const e = E(d.id), p = P(e.emp), m = M(e.mod); const note = (document.getElementById('note_' + e.id) || {}).value.trim();
    if (!note) { flash('Add a note so the employee knows what to work on.'); return; }
    e.note = note; log(`Hands-on check marked needs work for ${p.name}: ${m.title}. Note: ${note}`);
    flash(`Marked needs work. ${p.name.split(' ')[0]} will see your note.`); },
  smsign: d => { const e = E(d.id), p = P(e.emp), m = M(e.mod);
    e.smSign = e.ip; const fin = maybeComplete(e);
    log(`Service Manager sign-off for ${p.name}: ${m.title}. Can complete all tasks without assistance.`);
    flash(fin ? `${p.name} completed ${m.title}.` : `Sign-off recorded. ${p.name.split(' ')[0]} still needs to pass the fresh quiz.`); },
  logip: d => { const e = E(d.id), p = P(e.emp), m = M(e.mod);
    e.ip += 1; log(`Logged in-person training #${e.ip} for ${p.name}: ${m.title}`);
    flash(`In-person training #${e.ip} logged. ${p.name.split(' ')[0]} can now take a fresh quiz.`); },
  extend: d => { const e = E(d.id), days = +document.getElementById('ext_days').value, reason = document.getElementById('ext_reason').value.trim();
    if (!reason) { flash('Enter a reason for the extension.'); return; }
    const old = e.due; e.due = addDays(e.due, days);
    log(`Extended due date for ${P(e.emp).name}: ${M(e.mod).title}, ${fmt(old)} → ${fmt(e.due)}. Reason: ${reason}`);
    flash(`New due date: ${fmt(e.due)}.`); },
  doenroll: () => { const f = S.ef, sc = scope().filter(id => id !== S.viewer);
    const already = id => DB.enr.some(e => e.emp === id && e.mod === f.mod);
    const ids = (f.by === 'role' ? sc.filter(id => P(id).role === f.role) : f.picks).filter(id => !already(id));
    ids.forEach(id => { const sm = smOf(id); DB.enr.push({id:'e' + (DB.enr.length + 1) + '_' + id, emp:id, mod:f.mod, assigned:TODAY, due:f.due, reviewer:f.reviewer || (sm ? sm.id : S.viewer), stepsDone:[], attempts:[], ip:0, smSign:0, handsOn:false, done:null}); });
    log(`Enrolled ${ids.map(id => P(id).name).join(', ')} in ${M(f.mod).title}, due ${fmt(f.due)}`);
    S.ef.picks = []; flash(`Enrolled ${ids.length} in ${M(f.mod).title}.`); },
  saveso: d => { const e = E(d.id), n = soNeed(e);
    const vals = Array.from({length: n}, (_, i) => document.getElementById('so_' + e.id + '_' + i).value.trim());
    const filled = vals.filter(Boolean);
    if (new Set(filled).size !== filled.length) { flash('Each SO number must be different.'); return; }
    e.so = filled.join(', ');
    if (filled.length < n) { flash(`Saved ${filled.length} of ${n}. Enter all ${n} SO numbers to unlock the quiz.`); return; }
    log(`${P(e.emp).name} entered SO ${e.so} for ${M(e.mod).title}`); flash(n === 1 ? 'SO number saved. The quiz is unlocked.' : `All ${n} SO numbers saved. The quiz is unlocked.`); },
  modopen: d => { S.mod = d.id; },
  modclose: () => { S.mod = null; },
  togglepub: d => { const m = M(d.id); m.status = m.status === 'Published' ? 'Draft' : 'Published'; log(`${m.status === 'Published' ? 'Published' : 'Moved to draft'}: ${m.title}`); flash(`${m.title} is now ${m.status.toLowerCase()}.`); },
  additem: d => { const m = M(d.id), type = document.getElementById('ni_type').value, text = document.getElementById('ni_text').value.trim();
    if (!text) { flash('Type the item text first.'); return; }
    const at = type === 'step' ? m.items.filter(i => i.type === 'step').length : m.items.length;
    m.items.splice(at, 0, {type, text}); m.version += 1; log(`Added ${type === 'step' ? 'a step' : 'a hands-on check'} to ${m.title} (now version ${m.version})`); flash('Item added.'); }
};

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const fn = ACT[t.dataset.act]; if (!fn) return;
  fn(t.dataset); render();
});

document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'viewer') { S.viewer = t.value; S.view = homeFor(); S.mod = null; S.ef = null; S.quiz = null; render(); window.scrollTo(0,0); return; }
  if (t.dataset.step !== undefined) {
    const e = E(t.dataset.id), i = +t.dataset.step;
    e.stepsDone = t.checked ? [...new Set([...e.stepsDone, i])] : e.stepsDone.filter(x => x !== i);
    render(); return;
  }
  if (t.dataset.ef) { S.ef[t.dataset.ef] = t.value; if (t.dataset.ef === 'mod') S.ef.due = addDays(TODAY, M(t.value).days); render(); return; }
  if (t.dataset.pick) { const id = t.dataset.pick; S.ef.picks = t.checked ? [...S.ef.picks, id] : S.ef.picks.filter(x => x !== id); render(); return; }
  if (t.dataset.access) { const p = P(t.dataset.access), old = p.access; p.access = t.value; log(`Changed access level for ${p.name}: ${old} → ${p.access}`); flash(`${p.name} is now ${p.access}.`); render(); return; }
  if (t.dataset.active) { const p = P(t.dataset.active); p.active = t.checked; log(`${p.active ? 'Reactivated' : 'Deactivated'} ${p.name}. Training history kept.`); flash(`${p.name} ${p.active ? 'reactivated' : 'deactivated'}.`); render(); return; }
});

document.addEventListener('submit', ev => {
  if (ev.target.id !== 'quizForm') return;
  ev.preventDefault();
  const e = E(ev.target.dataset.id), m = M(e.mod), qs = m.items.filter(i => i.type === 'quiz');
  const fd = new FormData(ev.target);
  if (qs.some((q,i) => !fd.get('q' + i))) { flash('Answer every question before submitting.'); return; }
  const right = qs.filter((q,i) => +fd.get('q' + i) === q.answer).length;
  const score = Math.round(right / qs.length * 100), pass = score >= 80;
  const missed = qs.map((q,i) => [i, +fd.get('q' + i)]).filter(([i, pick]) => pick !== qs[i].answer);
  e.attempts.push({phase:e.ip, score, date:TODAY, missed});
  const sm = smOf(e.emp), smName = sm ? sm.name : 'your Service Manager', p = P(e.emp);
  const used = phaseAtt(e, e.ip).length, limit = e.ip === 0 ? 2 : 1;
  let msg;
  if (pass) {
    const fin = maybeComplete(e);
    msg = fin ? 'Module complete.' : e.ip === 0 ? `Next: ${P(e.reviewer) ? P(e.reviewer).name : 'your reviewer'} watches you do the task live and signs off.` : `Next: ${smName} signs off that you can do every task without help.`;
  } else if (used < limit) {
    msg = `You need 80% to pass. You have ${limit - used} attempt left. Review the steps, then try again.`;
  } else if (e.ip < 2) {
    msg = `That was your last attempt for now. ${smName} will schedule in-person training with you.`;
    log(`${p.name} scored below 80% on ${m.title} (${phaseAtt(e, e.ip).map(a => a.score + '%').join(', ')}). Status set to Needs in-person training. ${p.name} and ${smName} notified.`);
  } else {
    msg = `Please see ${smName} about next steps.`;
    log(`${p.name} failed the quiz after the second in-person training (${score}%). Status set to Final attempt failed. ${smName} and admins notified.`, true);
  }
  const reveal = pass || used >= limit;
  S.quiz = {id:e.id, score, pass, msg, reveal, missed: missed.map(([i, pick]) => ({n: i + 1, q: qs[i].q, pick: qs[i].options[pick], right: qs[i].options[qs[i].answer]}))};
  render(); window.scrollTo(0,0);
});

render();
</script>
